spring:
  cloud:
    nacos:
      # 配置中心（解决空配置警告）
      config:
        server-addr: 39.107.236.216:8848
        namespace: yudao-cloud
        group: DEFAULT_GROUP
      # 注册中心（核心修复）
      discovery:
        server-addr: 39.107.236.216:8848
        namespace: yudao-cloud
        group: DEFAULT_GROUP
        service: gateway-server
        port: 48080
        # 关键3：若Nacos服务端开启了认证，添加账号密码（默认nacos/nacos）
        username: nacos
        password: nacos
        # 连接失败重试次数
        fail-fast: false
# 日志文件配置
logging:
  level:
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR # TODO 芋艿：先禁用，Spring Boot 3.X 存在部分错误的 WARN 提示
